<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧑‍💻</text></svg>">
    <title>Projects — Salih Ünal</title>
</head>

<body>

    <script>
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- NAVBAR -->
    <nav class="site-nav">
        <a href="index.html" class="site-nav-brand">Salih Ünal</a>
        <button class="site-nav-toggle d-md-none" id="navToggle" aria-label="Toggle navigation">
            <i class="bi bi-list"></i>
        </button>
        <div class="site-nav-links" id="navLinks">
            <a href="index.html">Go Back</a>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="mb-2">All Projects</h1>
        <p class="text-muted mb-4">A collection of games I've built over the years.</p>
        <div id="tag-bar" class="d-flex flex-wrap justify-content-center gap-2 mb-3"></div>
        <p id="game-count" class="text-muted small mb-4 text-center"></p>
        <div style="position: relative; min-height: 200px;">
            <div id="grid-loader">
                <div class="spinner-border text-accent" role="status"></div>
            </div>
            <div id="projects-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
        </div>
    </div>

    <footer class="text-center py-3">
        <p class="text-muted mb-0" style="font-size: 0.8rem;">© 2026 Salih Ünal. All rights reserved.</p>
    </footer>

    <script src="scripts/projects_grid.js"></script>
    <script>
        const _t = document.getElementById('navToggle');
        const _l = document.getElementById('navLinks');
        _t.onclick = () => _l.classList.toggle('open');
        _l.querySelectorAll('a').forEach(a => a.addEventListener('click', () => _l.classList.remove('open')));
        document.addEventListener('click', e => { if (!_l.contains(e.target) && !_t.contains(e.target)) _l.classList.remove('open'); });
    </script>

</body>

</html>
